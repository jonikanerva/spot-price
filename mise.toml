# Source of truth for the tool versions and the command surface (STACK.md §1
# and §3). The Rust version comes only from rust-toolchain.toml.
#
# A fresh machine: install mise and rustup, then run `mise trust` and
# `mise run setup` in the repository root.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
# Node and pnpm run only the Playwright journeys and Prettier. They do not
# ship in the production image.
node = "24.22.0"
pnpm = "12.14.0"
# The PostgreSQL version of production (Railway image postgres-ssl:18).
"conda:postgresql" = "18.6"
# Keep the options equal to the pin of the owner's other projects; a different
# option set makes mise reinstall the tool on every project switch.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls", locked = true }
cargo-deny = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"github:Boshen/cargo-shear" = "1.14.0"
gitleaks = "8.30.1"

# The tests and the query checks use only the isolated server of
# scripts/test-db.sh. Their tasks set DATABASE_URL themselves, so a
# DATABASE_URL in the shell or in .env.local cannot reach them.
#
# The local settings of the service are in .env.local, not .env: the SQLx
# query macros parse every .env file in the crate directory and its parents
# at compile time.

[tasks.setup]
description = "Install the pinned tools, the locked dependencies, and the Playwright browser"
run = [
  "mise install",
  "cargo fetch --locked",
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright install chromium",
]

[tasks."db:start"]
description = "Start the isolated test PostgreSQL on 127.0.0.1:55436 and migrate it"
run = "scripts/test-db.sh start"

[tasks."db:stop"]
description = "Stop the isolated test PostgreSQL"
run = "scripts/test-db.sh stop"

[tasks.format]
description = "Format the Rust sources and the Prettier files (TypeScript, Markdown, JSON, YAML)"
run = ["cargo fmt --all", "pnpm exec prettier --write . --log-level warn"]

[tasks.format-check]
description = "Fail on a formatting difference; change no file"
run = ["cargo fmt --all -- --check", "pnpm exec prettier --check . --log-level warn"]

[tasks.lint]
description = "Clippy on every target and the type check of the e2e TypeScript; warnings are errors"
env = { SQLX_OFFLINE = "true" }
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "pnpm exec tsc -p e2e/tsconfig.json",
]

[tasks."sqlx:prepare"]
description = "Regenerate .sqlx query metadata from the isolated database"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55436/spot_price_dev" }
run = "cargo sqlx prepare --no-dotenv --workspace -- --all-targets --locked"

[tasks."sqlx:check"]
description = "Fail when .sqlx differs from the queries and the migrated schema"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55436/spot_price_dev" }
run = "cargo sqlx prepare --no-dotenv --workspace --check -- --all-targets --locked"

[tasks.build]
description = "The locked release build with the committed query metadata"
env = { SQLX_OFFLINE = "true" }
run = "cargo build --release --locked --package spot-price-server"

[tasks.test]
description = "Nextest and the doc tests against the isolated database"
depends = ["db:start"]
env = { DATABASE_URL = "postgres://postgres@127.0.0.1:55436/spot_price_dev", SQLX_OFFLINE = "true" }
run = [
  "cargo nextest run --workspace --locked --no-tests=fail",
  "cargo test --doc --workspace --locked",
]

[tasks."contract:check"]
description = "Fail when contract/openapi.json differs from the Rust HTTP types; change no file"
env = { SQLX_OFFLINE = "true" }
run = '''
set -eu
exported="$(mktemp)"
trap 'rm -f "$exported"' EXIT
cargo run --locked --quiet --package spot-price-server -- export-openapi "$exported"
if ! cmp -s "$exported" contract/openapi.json; then
  echo "contract:check: contract/openapi.json differs from the exported document" >&2
  diff -u contract/openapi.json "$exported" | head -n 40 >&2 || true
  exit 1
fi
'''

[tasks."scan:secrets"]
description = "Gitleaks on the history, the staged changes, and the unstaged changes of tracked files"
# Untracked files such as .env.local are not scanned.
run = [
  "gitleaks git --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --staged --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --pre-commit --no-banner --redact --log-level warn --config .gitleaks.toml .",
]

[tasks."scan:deps"]
description = "cargo-deny (advisories, bans, licences, sources), cargo-shear, and pnpm audit"
run = [
  "cargo deny --locked check",
  "cargo shear --deny-warnings",
  "pnpm audit --audit-level high",
]

# The browser journeys run against the release binary on the database
# spot_price_e2e of the isolated test server (playwright.config.ts).
[tasks.e2e]
description = "Build the release binary, reset and seed the e2e database, and run the Playwright journeys"
depends = ["db:start", "build"]
env = { E2E_DATABASE_URL = "postgres://postgres@127.0.0.1:55436/spot_price_e2e" }
run = '''
set -eu
bin="$(mise where conda:postgresql)/bin"
psql() { "$bin/psql" --host=127.0.0.1 --port=55436 --username=postgres --quiet --set=ON_ERROR_STOP=1 "$@"; }
psql --dbname=postgres \
  --command="DROP DATABASE IF EXISTS spot_price_e2e WITH (FORCE)" \
  --command="CREATE DATABASE spot_price_e2e"
DATABASE_URL="$E2E_DATABASE_URL" LOG_FORMAT=text ./target/release/spot-price migrate
psql --dbname=spot_price_e2e --file=e2e/seed.sql
pnpm exec playwright test
'''

[tasks.verify]
description = "The full verification (VERIFY_CMD); stops at the first failed step"
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "sqlx:check" },
  { task = "contract:check" },
  { task = "scan:secrets" },
  { task = "scan:deps" },
  { task = "build" },
  { task = "test" },
  { task = "e2e" },
]

[tasks.smoke]
description = "Smoke check of a locally running server (BASE_URL, default http://localhost:3000); never production"
run = "scripts/smoke-local.sh"

# SQLX_OFFLINE: the query macros use .sqlx, not the database of .env.local.
[tasks.dev]
description = "Migrate the database of .env.local and run the service with readable logs"
env = { _.file = ".env.local", LOG_FORMAT = "text", SQLX_OFFLINE = "true" }
raw = true
run = [
  "cargo run --locked --package spot-price-server -- migrate",
  "cargo run --locked --package spot-price-server -- serve",
]
