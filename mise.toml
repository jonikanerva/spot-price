# Source of truth for the tool versions and the command surface (STACK.md §1
# and §3). The Rust version comes only from rust-toolchain.toml.
#
# A fresh machine: install mise and rustup, then run `mise trust` and
# `mise run setup` in the repository root.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
# The only PostgreSQL version setting of the local servers (STACK.md §3 and
# §15 Infrastructure). The major version follows production (Railway image
# postgres-ssl:18). The digest pins the multi-platform image index; the tag is
# for people. scripts/db.sh runs every local server from this image in an
# Apple container; the Mac has no PostgreSQL install.
SPOT_PRICE_PG_IMAGE = "docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc"

[tools]
# Node and pnpm run only the Playwright journeys and Prettier. They do not
# ship in the production image.
node = "26.13.1"
pnpm = "12.21.0"
# Keep the options equal to the pin of the owner's other projects; a different
# option set makes mise reinstall the tool on every project switch.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = false, features = "postgres,rustls", locked = true }
cargo-deny = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"
"github:Boshen/cargo-shear" = "1.14.1"
gitleaks = "8.30.1"

# Local PostgreSQL (STACK.md §3). scripts/db.sh starts every server in an
# Apple container. The tests, the e2e journeys, and the query checks get a new
# test server per run and set DATABASE_URL to it, so a DATABASE_URL in the
# shell or in .env.local cannot reach them. `dev` uses the dev server of this
# worktree unless SPOT_PRICE_DATABASE_URL is set.
#
# The local settings of the service are in .env.local, not .env: the SQLx
# query macros parse every .env file in the crate directory and its parents
# at compile time.

[tasks.setup]
description = "Install the pinned tools, the locked dependencies, the Playwright browser, and the PostgreSQL image"
run = [
  "mise install",
  "cargo fetch --locked",
  "pnpm install --frozen-lockfile",
  "pnpm exec playwright install chromium",
  "scripts/db.sh setup",
]

# `dev`, `test`, `e2e`, `sqlx:*`, and `verify` start and stop their servers
# themselves. The db: tasks below are optional tools.
[tasks."db:start"]
description = "Keep the dev PostgreSQL of this worktree running until db:stop"
run = "scripts/db.sh start"

[tasks."db:stop"]
description = "Stop the dev PostgreSQL of this worktree; the data stays in its volume"
run = "scripts/db.sh stop"

[tasks."db:info"]
description = "Show the PostgreSQL servers of this worktree"
run = "scripts/db.sh info"

[tasks."db:psql"]
description = "Open psql on the dev database of this worktree (arguments go to psql)"
raw = true
run = "scripts/db.sh psql"

[tasks."db:dump"]
description = "Write the dev database of this worktree to a pg_dump archive: mise run db:dump <file>"
run = "scripts/db.sh dump"

[tasks."db:restore"]
description = "Replace the dev database with a pg_dump archive; the old one goes to .tmp/db/backups: mise run db:restore <file>"
run = "scripts/db.sh restore"

[tasks."db:clone"]
description = "Replace the dev database with the one of another worktree; the old one goes to .tmp/db/backups: mise run db:clone <path>"
run = "scripts/db.sh clone"

[tasks."db:reset"]
description = "Replace the dev database with an empty one; the old one goes to .tmp/db/backups"
run = "scripts/db.sh reset"

[tasks."db:gc"]
description = "Run the database clean-up now, and remove the kept test servers of this worktree"
run = "scripts/db.sh gc"

[tasks.format]
description = "Format the Rust sources and the Prettier files (TypeScript, Markdown, JSON, YAML)"
run = ["cargo fmt --all", "pnpm exec prettier --write . --log-level warn"]

[tasks.format-check]
description = "Fail on a formatting difference; change no file"
run = ["cargo fmt --all -- --check", "pnpm exec prettier --check . --log-level warn"]

[tasks.lint]
description = "Clippy on every target and the type check of the e2e TypeScript; warnings are errors"
env = { SQLX_OFFLINE = "true" }
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "pnpm exec tsc -p e2e/tsconfig.json",
]

[tasks."sqlx:prepare"]
description = "Regenerate .sqlx query metadata from a new test server"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx prepare"

[tasks."sqlx:check"]
description = "Fail when .sqlx differs from the queries and the migrated schema"
run = "scripts/db.sh with-test-db -- scripts/db.sh sqlx check"

[tasks.build]
description = "The locked release build with the committed query metadata"
env = { SQLX_OFFLINE = "true" }
run = "cargo build --release --locked --package spot-price-server"

[tasks.test]
description = "The lock test of scripts/db.sh, then nextest and the doc tests against a new test server"
env = { SQLX_OFFLINE = "true" }
run = [
  "scripts/db-lock-test.sh",
  "scripts/db.sh with-test-db -- sh -c 'cargo nextest run --workspace --locked --no-tests=fail && cargo test --doc --workspace --locked'",
]

[tasks."contract:check"]
description = "Fail when contract/openapi.json differs from the Rust HTTP types; change no file"
env = { SQLX_OFFLINE = "true" }
run = '''
set -eu
exported="$(mktemp)"
trap 'rm -f "$exported"' EXIT
cargo run --locked --quiet --package spot-price-server -- export-openapi "$exported"
if ! cmp -s "$exported" contract/openapi.json; then
  echo "contract:check: contract/openapi.json differs from the exported document" >&2
  diff -u contract/openapi.json "$exported" | head -n 40 >&2 || true
  exit 1
fi
'''

[tasks."scan:secrets"]
description = "Gitleaks on the history, the staged changes, and the unstaged changes of tracked files"
# Untracked files such as .env.local are not scanned.
run = [
  "gitleaks git --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --staged --no-banner --redact --log-level warn --config .gitleaks.toml .",
  "gitleaks git --pre-commit --no-banner --redact --log-level warn --config .gitleaks.toml .",
]

[tasks."scan:deps"]
description = "cargo-deny (advisories, bans, licences, sources), cargo-shear, and pnpm audit"
run = [
  "cargo deny --locked check",
  "cargo shear --deny-warnings",
  "pnpm audit --audit-level high",
]

# The browser journeys run against a copy of the release binary on the
# database spot_price_e2e of a new test server (playwright.config.ts).
[tasks.e2e]
description = "Build the release binary, create and seed the e2e database, and run the Playwright journeys"
run = "scripts/db.sh with-test-db -- scripts/db.sh e2e"

[tasks.verify]
description = "The full verification (VERIFY_CMD); stops at the first failed step"
# One test server for all steps: --share lets the nested sqlx:check, test,
# and e2e tasks use it. An independent run beside verify gets its own server.
run = "scripts/db.sh with-test-db --share -- mise run verify:steps"

[tasks."verify:steps"]
description = "The steps of verify; run verify instead"
hide = true
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "sqlx:check" },
  { task = "contract:check" },
  { task = "scan:secrets" },
  { task = "scan:deps" },
  { task = "build" },
  { task = "test" },
  { task = "e2e" },
]

[tasks.smoke]
description = "Smoke check of the service of `mise run dev` in this worktree (or BASE_URL); never production"
run = 'BASE_URL="${BASE_URL:-http://localhost:$(cat .tmp/db/app-port 2>/dev/null || echo 3000)}" scripts/smoke-local.sh'

# SQLX_OFFLINE: the query macros use .sqlx, not a database.
# `dev` runs `migrate` before `serve`, like the production start command.
[tasks.dev]
description = "Migrate the dev PostgreSQL of this worktree and run the service with .env.local and readable logs"
env = { _.file = ".env.local", LOG_FORMAT = "text", SQLX_OFFLINE = "true" }
raw = true
run = "scripts/db.sh with-dev-db -- sh -c 'cargo run --locked --package spot-price-server -- migrate && exec cargo run --locked --package spot-price-server -- serve'"
