# The Rust workspace: the pure domain crate, the server crate, and the offline
# forecast tools.
[workspace]
members = ["crates/*"]
resolver = "3"

# crates/server/Cargo.toml repeats these values for Railpack. Keep them equal.
[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Proprietary"

# STACK.md §6 records the reason of each dependency. Pin each version exactly
# and enable only the features that the code uses. Each crate inherits its
# entries with `workspace = true`.
[workspace.dependencies]
# The path dependency has a version, so cargo-deny does not see a wildcard.
spot-price-domain = { path = "crates/domain", version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
croner = { version = "=4.0.1", default-features = false, features = ["jiff"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
jiff-sqlx = { version = "=0.2.0", default-features = false, features = ["postgres"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
# `float_roundtrip` parses each number to the nearest double, like JavaScript.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
# No TLS backend: the service reaches PostgreSQL over the Railway private
# network without TLS, like the TypeScript service did (STACK.md §5).
# `sqlx-toml` reads crates/server/sqlx.toml, which maps TIMESTAMPTZ to Jiff.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "sqlx-toml"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
# 0.6, not 0.7: reqwest already depends on 0.6.11, so the graph has one copy.
tower-http = { version = "=0.6.11", default-features = false, features = ["catch-panic", "set-header"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }

# The lints of the default Rust profile (STACK.md §1). Each crate inherits
# them with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
