services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: spot
      POSTGRES_PASSWORD: spot
      POSTGRES_DB: spot_price
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets `docker compose up -d --wait` (pnpm db:up) block until Postgres is
    # actually accepting connections, so `pnpm dev`/`pnpm seed` are non-racy.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spot -d spot_price"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
